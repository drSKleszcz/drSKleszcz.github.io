      tools: Python · Excel / VBA · Monte Carlo
  about_label: 03 / O mnie
  about_title: Badania osadzone w praktyce inżynierskiej.
  about_text: Nazywam się Sławosz Kleszcz. Jestem inżynierem R&D ze stopniem EngD i doświadczeniem zdobytym na uczelniach oraz w przemyśle. Zajmuję się modelowaniem przepływów, symulacjami numerycznymi, analizą techniczno-ekonomiczną i oprogramowaniem inżynierskim.
  about_second: Od odzysku ciepła i turbin gazowych po pomiary przepływu i narzędzia obliczeniowe - łączę modelowanie z praktycznym rozwojem, aby zrozumieć działanie systemów i je doskonalić.
  experience_title: Doświadczenie
  experience:
    - title: Badania i rozwój inżynierski
      organization: AGH / Frapol
      text: 'Doktorat wdrożeniowy i rozwój HVAC: modelowanie CFD i wymiany ciepła, sterowanie oraz walidacja eksperymentalna.'
    - title: Badania systemów energetycznych
      organization: UiS
      text: 'Turbiny gazowe, infrastruktura wodorowa i magazynowanie: modelowanie, rozwój systemów i analiza techniczno-ekonomiczna.'
    - title: Analityka biznesowa
      organization: FedEx
      text: Analiza danych, modele kosztów i narzędzia Python/Excel do wycen, automatyzacji i decyzji biznesowych.
