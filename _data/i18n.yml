  about_label: 03 / About
  about_title: From complex systems to clear decisions.
  about_text: I am Sławosz Kleszcz, an R&D engineer with an EngD and experience in universities and industry. I work across numerical modeling, data analysis and software development, connecting engineering research with practical and business applications.
  about_second: My projects range from energy systems and experimental validation to pricing, cost modeling and Python tools. I combine simulation, measurements and analysis to understand how systems perform and support informed decisions.
  experience_title: Experience
