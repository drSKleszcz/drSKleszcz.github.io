      text: CFD, wymiana ciepła i masy oraz modele procesowe 0D/1D, połączone z prototypami, pomiarami i walidacją eksperymentalną.
      tools: ANSYS · IPSEpro · SolidWorks
    - title: Data science i analityka biznesowa
      text: Analiza danych, modele cenowe i kosztowe, ocena techniczno-ekonomiczna oraz analiza niepewności wspierające decyzje inżynierskie i biznesowe.
      tools: Python · Excel / VBA · Monte Carlo
    - title: Oprogramowanie i automatyzacja
