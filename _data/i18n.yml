      organization: UiS
      text: 'Gas turbines, hydrogen infrastructure and storage: modeling, system development and techno-economic analysis.'
    - title: Business analytics
      organization: FedEx
      text: Data analysis, cost models and Python/Excel tools for pricing, automation and business decisions.
