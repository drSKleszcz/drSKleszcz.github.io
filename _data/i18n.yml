  about_label: 03 / About
  about_title: Research grounded in real engineering.
  about_text: I am Sławosz Kleszcz, an R&D engineer with a EngD and experience in universities and industry. My work spans process flow modeling, numerical simulation, techno-economic analysis and engineering software.
  about_second: From heat recovery and gas turbines to flow measurement and calculation tools, I bring modeling and practical development together to understand how systems perform - and how to improve them.
  experience_title: Experience
  experience:
    - title: Engineering R&D
