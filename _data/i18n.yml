      tools: Python · LabVIEW · Automatyka
  about_label: 03 / O mnie
  about_title: Od złożonych systemów do świadomych decyzji.
  about_text: Nazywam się Sławosz Kleszcz. Jestem inżynierem R&D ze stopniem EngD i doświadczeniem zdobytym na uczelniach oraz w przemyśle. Łączę modelowanie numeryczne, analizę danych i rozwój oprogramowania z badaniami inżynierskimi oraz zastosowaniami biznesowymi.
  about_second: Moje projekty obejmują systemy energetyczne, walidację eksperymentalną, analizę cen, modelowanie kosztów i narzędzia w Pythonie. Wykorzystuję symulacje, pomiary i analizę, aby zrozumieć działanie systemów i wspierać świadome decyzje.
  experience_title: Doświadczenie
  experience:
    - title: Badania i rozwój inżynierski
      organization: AGH / Frapol
      text: 'Doktorat wdrożeniowy i rozwój HVAC: modelowanie CFD i wymiany ciepła, sterowanie oraz walidacja eksperymentalna.'
    - title: Badania systemów energetycznych
      organization: UiS
      text: 'Turbiny gazowe, infrastruktura wodorowa i magazynowanie: modelowanie, rozwój systemów i analiza techniczno-ekonomiczna.'
    - title: Analityka biznesowa
      organization: FedEx
      text: Analiza danych, modele kosztów i narzędzia Python/Excel do wycen, automatyzacji i decyzji biznesowych.
