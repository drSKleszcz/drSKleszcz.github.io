<section class="contact-section section" id="contact" aria-labelledby="contact-heading">
  <div class="container contact-grid">
    <div class="contact-intro"><p class="eyebrow">{{ t.contact_label }}</p><h2 id="contact-heading">{{ t.contact_title }}</h2><p>{{ t.contact_text }}</p>
      <div class="contact-links"><a class="text-link" href="https://www.linkedin.com/in/slawosz-kleszcz">LinkedIn <span aria-hidden="true">↗</span></a><a class="text-link" href="mailto:{{ site.contact_email | escape }}" aria-label="{{ t.contact_mail }} - {{ site.contact_email | escape }}">{{ t.contact_mail }}</a></div>
    </div>
    <form id="contact-form" action="{{ site.form_endpoint }}" method="post" data-sending="{{ t.sending }}" data-success="{{ t.success }}" data-failure="{{ t.failure }}" data-invalid="{{ t.invalid }}" aria-describedby="form-note required-note">
      <p class="form-required" id="required-note">{{ t.required_note }}</p>
      <div class="form-row">
        <div><label for="contact-name">{{ t.name }}</label><input id="contact-name" name="name" autocomplete="name" required maxlength="200"></div>
        <div><label for="contact-email">{{ t.email }}</label><input id="contact-email" type="email" name="_replyto" autocomplete="email" required maxlength="254"></div>
      </div>
      <label for="contact-message">{{ t.message }}</label><textarea id="contact-message" name="message" rows="5" required maxlength="10000"></textarea>
      <input type="hidden" name="_subject" value="Portfolio enquiry / Wiadomość z portfolio">
      <div class="honeypot" aria-hidden="true"><label for="contact-extra">Website</label><input id="contact-extra" name="_gotcha" tabindex="-1" autocomplete="off"></div>
      <p id="contact-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <div class="form-end"><button class="button" type="submit">{{ t.send }}</button><p id="form-note">{{ t.form_note }}</p></div>
    </form>
  </div>
</section>
